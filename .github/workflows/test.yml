name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned EAI submodule
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Run the full test suite
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Reject tracked secrets, generated outputs, and stale local paths
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "A local .env file is tracked."
            exit 1
          fi

          unexpected_outputs="$(git ls-files runs data/processed/eai_clean | grep -Ev '^(runs|data/processed)/\.gitkeep$' || true)"
          if [ -n "$unexpected_outputs" ]; then
            echo "Generated outputs are tracked:"
            echo "$unexpected_outputs"
            exit 1
          fi

          if git grep -nE '/Users/(wuzihan|hanson)/' -- . ':!uv.lock'; then
            echo "A machine-specific absolute path is tracked."
            exit 1
          fi
