[project]
name = "embodied-goal-action-gap"
version = "0.1.0"
description = "Experimental framework for structured prompting, retrieval, and isolated recovery in LLM embodied planning."
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi>=2024.0.0",
]

[project.scripts]
embodied-gap = "embodied_gap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
